<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Home</title>
<style>
  :root {
    --bg: #0b0d12;
    --bg-glow: #1a2238;
    --text: #f2f4f8;
    --muted: #8a93a6;
    --focus: #ffffff;
    --panel: #151a24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 15% -10%, var(--bg-glow), transparent 70%), var(--bg);
    color: var(--text);
    font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
    overflow: hidden;
    cursor: default;
    display: flex;
    flex-direction: column;
    padding: 4vh 5vw;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; }
  .greet { font-size: clamp(28px, 3.2vh, 48px); font-weight: 600; letter-spacing: -0.01em; }
  .date { color: var(--muted); font-size: clamp(16px, 1.9vh, 28px); margin-top: .4em; }
  .clock { font-size: clamp(48px, 7vh, 110px); font-weight: 300; font-variant-numeric: tabular-nums; }

  main { flex: 1; display: flex; align-items: center; }
  .grid {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(clamp(220px, 15vw, 420px), 1fr));
    gap: clamp(18px, 2.4vh, 40px);
  }
  .tile {
    aspect-ratio: 16 / 9;
    border-radius: 18px;
    border: 0;
    color: #fff;
    font: inherit;
    font-size: clamp(22px, 2.8vh, 42px);
    font-weight: 700;
    letter-spacing: -0.01em;
    display: flex;
    align-items: flex-end;
    justify-content: flex-start;
    padding: 0.8em 0.9em;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    filter: brightness(.82) saturate(.9);
    outline: none;
  }
  .tile::before {
    content: attr(data-mark);
    position: absolute;
    top: .25em; right: .35em;
    font-size: 2.8em;
    font-weight: 800;
    opacity: .18;
    line-height: 1;
  }
  .tile:focus {
    transform: scale(1.07);
    filter: none;
    box-shadow: 0 0 0 4px var(--focus), 0 24px 60px rgba(0,0,0,.6);
    z-index: 1;
  }

  footer { display: flex; align-items: center; gap: 24px; color: var(--muted); font-size: clamp(14px, 1.6vh, 22px); }
  .pair { display: flex; align-items: center; gap: 20px; background: var(--panel); padding: 14px 20px 14px 14px; border-radius: 16px; }
  #qr { background: #fff; padding: 8px; border-radius: 8px; line-height: 0; }
  #qr img, #qr canvas { width: clamp(96px, 11vh, 160px) !important; height: auto !important; }
  .pair b { color: var(--text); display: block; font-size: 1.15em; margin-bottom: .3em; }
  .pair code { font-size: .85em; word-break: break-all; }
  .warn { color: #ffb454; }
  .hint { margin-left: auto; text-align: right; }
  [hidden] { display: none !important; }

  /* Wallpaper mode */
  #wall {
    position: fixed; inset: 0; z-index: 10; background: #000; overflow: hidden;
    opacity: 0; pointer-events: none; transition: opacity 1.2s ease;
  }
  #wall.on { opacity: 1; pointer-events: auto; cursor: none; }
  #wall .layer {
    position: absolute; inset: -2%;
    background-size: cover; background-position: center;
    opacity: 0; transition: opacity 2.5s ease;
  }
  #wall .layer.show { opacity: 1; }
  #wall .layer.photo.show { animation: kenburns 45s ease-in-out both; }
  #wall .layer.scene { background-size: 300% 300%; }
  #wall .layer.scene.show { animation: drift 40s ease-in-out infinite alternate; }
  @keyframes kenburns {
    from { transform: scale(1) translate(0, 0); }
    to   { transform: scale(1.1) translate(-1.5%, -1%); }
  }
  @keyframes drift {
    from { background-position: 0% 30%; }
    to   { background-position: 100% 70%; }
  }
  #wall .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.55), transparent 45%); }
  #wall .wclock {
    position: absolute; left: 5vw; bottom: 7vh;
    text-shadow: 0 2px 24px rgba(0,0,0,.5);
    transition: transform 3s ease;
  }
  #wall .wtime { font-size: clamp(64px, 12vh, 200px); font-weight: 200; line-height: 1; font-variant-numeric: tabular-nums; }
  #wall .wdate { font-size: clamp(18px, 2.6vh, 40px); opacity: .85; margin-top: .4em; }
  @media (prefers-reduced-motion: reduce) {
    #wall .layer.photo.show, #wall .layer.scene.show { animation: none; }
  }
  kbd { background: var(--panel); border-radius: 6px; padding: 2px 8px; color: var(--text); font-family: inherit; }
</style>
</head>
<body>
  <header>
    <div>
      <div class="greet" id="greet">Hello</div>
      <div class="date" id="date"></div>
    </div>
    <div class="clock" id="clock"></div>
  </header>

  <main><div class="grid" id="grid" role="list"></div></main>

  <footer>
    <div class="pair" id="pair" hidden>
      <div id="qr"></div>
      <div>
        <b>Use your phone as the remote</b>
        Scan with your phone camera (same Wi-Fi)<br>
        <code id="pairUrl"></code>
        <div class="warn" id="warn" hidden>Accessibility permission is off, so the remote can't press keys yet.</div>
      </div>
    </div>
    <div class="hint"><kbd>← ↑ → ↓</kbd> move &nbsp; <kbd>Enter</kbd> open</div>
  </footer>

  <div id="wall" aria-hidden="true">
    <div class="layer"></div>
    <div class="layer"></div>
    <div class="shade"></div>
    <div class="wclock"><div class="wtime" id="wtime"></div><div class="wdate" id="wdate"></div></div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const grid = document.getElementById('grid');

function tick() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  document.getElementById('date').textContent =
    now.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
  document.getElementById('wtime').textContent = document.getElementById('clock').textContent;
  document.getElementById('wdate').textContent = document.getElementById('date').textContent;
  const h = now.getHours();
  document.getElementById('greet').textContent =
    h < 5 ? 'Good night' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
}
tick();
setInterval(tick, 10000);

async function loadApps() {
  const apps = await (await fetch('/apps.json')).json();
  for (const app of apps) {
    const t = document.createElement('button');
    t.className = 'tile';
    t.role = 'listitem';
    t.textContent = app.name;
    t.dataset.mark = app.name[0];
    t.style.background = `linear-gradient(135deg, ${app.color}, #0b0d12 140%)`;
    t.onclick = () => { location.href = app.url; };
    grid.appendChild(t);
  }
  let last = 0;
  try { last = +localStorage.getItem('tv.focus') || 0; } catch (e) {}
  (grid.children[last] || grid.children[0])?.focus();
}

// Arrow-key navigation over the grid, so the phone's D-pad works here.
function columns() {
  const tiles = [...grid.children];
  const top = tiles[0]?.offsetTop;
  return tiles.filter(t => t.offsetTop === top).length || 1;
}
document.addEventListener('keydown', e => {
  if (wallOn) { e.preventDefault(); exitWall(); return; }
  const tiles = [...grid.children];
  let i = tiles.indexOf(document.activeElement);
  if (i < 0) { tiles[0]?.focus(); return; }
  const cols = columns();
  const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -cols, ArrowDown: cols }[e.key];
  if (step === undefined) return;
  e.preventDefault();
  const next = Math.min(Math.max(i + step, 0), tiles.length - 1);
  tiles[next].focus();
  try { localStorage.setItem('tv.focus', next); } catch (err) {}
});

async function loadPairing() {
  try {
    const r = await fetch('/api/pair');
    if (!r.ok) return;
    const p = await r.json();
    document.getElementById('pairUrl').textContent = p.url;
    document.getElementById('warn').hidden = p.trusted;
    if (window.QRCode) new QRCode(document.getElementById('qr'), { text: p.url, width: 320, height: 320 });
    else document.getElementById('qr').hidden = true;
    document.getElementById('pair').hidden = false;
  } catch (e) { /* not served by the local server */ }
}

// Wallpaper mode: photos from ~/Pictures/TV Wallpapers (or built-in colour scenes),
// crossfading every 30s. Opens after a few idle minutes, or via /tv#wallpaper from the remote.
const IDLE_MS = 5 * 60 * 1000;
const SLIDE_MS = 30 * 1000;
const SCENES = [
  ['#0f2027', '#203a43', '#2c5364', '#0b0d12'],
  ['#2b1055', '#7597de', '#0b0d12', '#2b1055'],
  ['#3a1c71', '#d76d77', '#ffaf7b', '#3a1c71'],
  ['#134e5e', '#71b280', '#0b2a2f', '#134e5e'],
  ['#0f0c29', '#302b63', '#24243e', '#0f0c29'],
  ['#42275a', '#734b6d', '#1c1c2e', '#42275a'],
];
const wall = document.getElementById('wall');
const layers = [...wall.querySelectorAll('.layer')];
let wallOn = false, slides = null, slide = 0, front = 0, slideTimer, idleTimer, driftTimer, wakeLock;

async function loadSlides() {
  let photos = [];
  try {
    const r = await fetch('/api/wallpapers');
    if (r.ok) photos = await r.json();
  } catch (e) {}
  slides = photos.length
    ? photos.map(n => ({ img: '/wallpapers/' + encodeURIComponent(n) }))
    : SCENES.map(c => ({ scene: c }));
  for (let i = slides.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [slides[i], slides[j]] = [slides[j], slides[i]];
  }
}

function showSlide() {
  const s = slides[slide++ % slides.length];
  const next = layers[front ^ 1];
  const reveal = () => {
    next.className = 'layer ' + (s.img ? 'photo' : 'scene');
    next.style.backgroundImage = s.img ? `url("${s.img}")` : `linear-gradient(120deg, ${s.scene.join(', ')})`;
    void next.offsetWidth; // restart the zoom animation
    next.classList.add('show');
    layers[front].classList.remove('show');
    front ^= 1;
  };
  if (!s.img) return reveal();
  const im = new Image();
  im.onload = reveal;
  im.onerror = () => { slides = slides.filter(x => x !== s); if (slides.length) showSlide(); };
  im.src = s.img;
}

function driftClock() {
  // Nudge the clock a little every minute so it never burns into the screen.
  const x = Math.random() * 4, y = Math.random() * 4;
  wall.querySelector('.wclock').style.transform = `translate(${x}vw, ${-y}vh)`;
}

async function enterWall() {
  if (wallOn) return;
  wallOn = true;
  clearTimeout(idleTimer);
  if (!slides) await loadSlides();
  wall.classList.add('on');
  showSlide();
  slideTimer = setInterval(showSlide, SLIDE_MS);
  driftClock();
  driftTimer = setInterval(driftClock, 60 * 1000);
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {}
}

function exitWall() {
  if (!wallOn) return;
  wallOn = false;
  wall.classList.remove('on');
  clearInterval(slideTimer);
  clearInterval(driftTimer);
  wakeLock?.release().catch(() => {});
  wakeLock = null;
  slides = null; // pick up new photos next time
  if (location.hash === '#wallpaper') history.replaceState(null, '', '/tv');
  (document.activeElement?.classList.contains('tile') ? document.activeElement : grid.children[0])?.focus();
  resetIdle();
}

function resetIdle() {
  clearTimeout(idleTimer);
  if (!wallOn) idleTimer = setTimeout(enterWall, IDLE_MS);
}

let moved = 0;
document.addEventListener('mousemove', e => {
  if (!wallOn) return resetIdle();
  moved += Math.abs(e.movementX) + Math.abs(e.movementY);
  if (moved > 40) { moved = 0; exitWall(); }
});
['mousedown', 'wheel', 'touchstart'].forEach(ev => document.addEventListener(ev, () => wallOn ? exitWall() : resetIdle()));
document.addEventListener('keydown', () => { if (!wallOn) resetIdle(); }, true);
document.addEventListener('visibilitychange', async () => {
  if (wallOn && document.visibilityState === 'visible') {
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {}
  }
});
window.addEventListener('hashchange', () => location.hash === '#wallpaper' ? enterWall() : exitWall());

loadApps();
loadPairing();
if (location.hash === '#wallpaper') enterWall(); else resetIdle();
</script>
</body>
</html>
